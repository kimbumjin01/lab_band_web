<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    min-width: max-content;
    font-size: 13px;
  }
  th, td {
    border: 1px solid rgba(200, 210, 235, 0.45);
    padding: 5px 9px;
    text-align: center;
    white-space: nowrap;
  }
  th {
    background: #f1f4fb;
    font-weight: 600;
    color: #374151;
  }
  .time-col {
    background: #f1f4fb !important;
    font-weight: 600;
    color: #374151;
  }
  .data-cell {
    cursor: pointer;
    font-weight: 600;
    transition: outline 0.1s;
  }
  .data-cell:hover {
    outline: 2px solid rgba(99, 102, 241, 0.7);
    outline-offset: -2px;
  }
  .selected {
    outline: 3px solid #4f46e5 !important;
    outline-offset: -3px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
/*__BOOTSTRAP__*/

window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");

function slotKey(iso, time) { return iso + "|" + time; }

function getColor(ratio) {
  const l = [238, 244, 255], d = [29, 78, 216];
  const r = Math.round(l[0] + (d[0] - l[0]) * ratio);
  const g = Math.round(l[1] + (d[1] - l[1]) * ratio);
  const b = Math.round(l[2] + (d[2] - l[2]) * ratio);
  return "rgb(" + r + "," + g + "," + b + ")";
}

const { dates, times, all_availability, members, team_size } = __BOOTSTRAP__;

const table = document.createElement("table");

// 헤더
const thead = document.createElement("thead");
const headerRow = document.createElement("tr");
const corner = document.createElement("th");
corner.textContent = "시간";
corner.className = "time-col";
headerRow.appendChild(corner);
dates.forEach(function(d) {
  const th = document.createElement("th");
  th.textContent = d.label;
  headerRow.appendChild(th);
});
thead.appendChild(headerRow);
table.appendChild(thead);

// 본문
const tbody = document.createElement("tbody");
let selectedCell = null;

times.forEach(function(time) {
  const row = document.createElement("tr");

  const timeTd = document.createElement("td");
  timeTd.textContent = time;
  timeTd.className = "time-col";
  row.appendChild(timeTd);

  dates.forEach(function(d) {
    const key = slotKey(d.iso, time);
    const count = members.filter(function(m) {
      const slots = all_availability[m] || {};
      return slots[key] === true;
    }).length;

    const ratio = Math.min(count / team_size, 1.0);
    const td = document.createElement("td");
    td.textContent = count + "/" + team_size;
    td.style.backgroundColor = getColor(ratio);
    td.style.color = ratio >= 0.55 ? "#ffffff" : "#1e293b";
    td.style.fontWeight = ratio >= 0.7 ? "700" : "600";
    td.className = "data-cell";

    td.addEventListener("click", function() {
      if (selectedCell) selectedCell.classList.remove("selected");
      selectedCell = td;
      td.classList.add("selected");
      window.parent.postMessage({
        type: "streamlit:setComponentValue",
        value: { date: d.iso, time: time, label: d.label }
      }, "*");
    });

    row.appendChild(td);
  });

  tbody.appendChild(row);
});
table.appendChild(tbody);
document.getElementById("root").appendChild(table);
</script>
</body>
</html>
