<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; }

  .scroll-wrap { overflow-x: auto; width: 100%; }

  table {
    border-collapse: collapse;
    min-width: max-content;
    font-size: 13px;
  }

  th, td {
    border: 1px solid rgba(200, 210, 235, 0.45);
    padding: 5px 9px;
    text-align: center;
    white-space: nowrap;
  }

  th {
    background: #f1f4fb;
    font-weight: 600;
    color: #374151;
  }

  .time-col {
    background: #f1f4fb !important;
    font-weight: 600;
    color: #374151;
    position: sticky;
    left: 0;
    z-index: 1;
  }

  td.data-cell {
    cursor: pointer;
    transition: outline 0.12s;
    font-weight: 600;
  }

  td.data-cell:hover {
    outline: 2px solid rgba(99, 102, 241, 0.7);
    outline-offset: -2px;
  }

  td.selected {
    outline: 3px solid #4f46e5 !important;
    outline-offset: -3px;
  }
</style>
</head>
<body>
<div class="scroll-wrap">
  <table id="tbl"></table>
</div>

<script src="https://unpkg.com/streamlit-component-lib/dist/streamlit-component-lib.js"></script>
<script>
let selectedCell = null;

function slotKey(iso, time) {
  return iso + "|" + time;
}

function getColor(ratio) {
  const light = [238, 244, 255];
  const dark  = [29,  78,  216];
  const r = Math.round(light[0] + (dark[0] - light[0]) * ratio);
  const g = Math.round(light[1] + (dark[1] - light[1]) * ratio);
  const b = Math.round(light[2] + (dark[2] - light[2]) * ratio);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function onRender(event) {
  const args = event.detail.args;
  if (!args) return;

  const { dates, times, all_availability, members, team_size } = args;
  const table = document.getElementById("tbl");
  table.innerHTML = "";

  // 헤더
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "시간";
  corner.className = "time-col";
  headerRow.appendChild(corner);

  dates.forEach(d => {
    const th = document.createElement("th");
    th.textContent = d.label;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // 본문
  const tbody = document.createElement("tbody");
  times.forEach(time => {
    const row = document.createElement("tr");

    const timeTd = document.createElement("td");
    timeTd.textContent = time;
    timeTd.className = "time-col";
    row.appendChild(timeTd);

    dates.forEach(d => {
      const key = slotKey(d.iso, time);
      const count = members.filter(m => {
        const slots = all_availability[m] || {};
        return slots[key] === true;
      }).length;

      const ratio = Math.min(count / team_size, 1.0);
      const td = document.createElement("td");
      td.textContent = count + "/" + team_size;
      td.style.backgroundColor = getColor(ratio);
      td.style.color = ratio >= 0.55 ? "#ffffff" : "#1e293b";
      td.style.fontWeight = ratio >= 0.7 ? "700" : "600";
      td.className = "data-cell";

      td.addEventListener("click", () => {
        if (selectedCell) selectedCell.classList.remove("selected");
        selectedCell = td;
        td.classList.add("selected");
        Streamlit.setComponentValue({ date: d.iso, time: time, label: d.label });
      });

      row.appendChild(td);
    });

    tbody.appendChild(row);
  });
  table.appendChild(tbody);

  Streamlit.setFrameHeight(document.body.scrollHeight + 4);
}

Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
Streamlit.setComponentReady();
</script>
</body>
</html>
